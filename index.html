<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DreyBird</title>
<meta name="description" content="A one-file tribute to Flappy Bird. Tap to flap, thread the pipes, chase a medal.">
<meta name="theme-color" content="#dfe0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e14" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DreyBird">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700&family=Press+Start+2P&display=swap">

<style>
  :root {
    --page:      #dfe0e8;
    --page-2:    #c7c9d8;
    --text:      #22242f;
    --text-soft: #5a5d70;
    --line:      rgba(34, 36, 47, .18);
    --accent:    #c47c14;
    --sheet:     #f7f7fb;
    --sheet-2:   #e9ebf3;
    --shadow:    0 18px 44px rgba(20, 22, 34, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page:      #0d0e14;
      --page-2:    #191c27;
      --text:      #d3d6e3;
      --text-soft: #878ba2;
      --line:      rgba(211, 214, 227, .16);
      --accent:    #f5b32d;
      --sheet:     #171a25;
      --sheet-2:   #212536;
      --shadow:    0 18px 44px rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    --page:      #0d0e14;
    --page-2:    #191c27;
    --text:      #d3d6e3;
    --text-soft: #878ba2;
    --line:      rgba(211, 214, 227, .16);
    --accent:    #f5b32d;
    --sheet:     #171a25;
    --sheet-2:   #212536;
    --shadow:    0 18px 44px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--page-2), var(--page) 70%);
    color: var(--text);
    font-family: "Chivo", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  #stage {
    position: relative;
    aspect-ratio: 288 / 512;
    height: min(100%, calc(100dvw * 512 / 288));
    max-height: 100%;
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: var(--shadow);
    overflow: hidden;
    background: #4ec0e0;
    flex: 0 1 auto;
  }

  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }

  /* ---- overlay controls ---- */
  .iconbtn {
    position: absolute;
    top: 8px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid rgba(255, 255, 255, .35);
    border-radius: 3px;
    background: rgba(16, 20, 34, .34);
    color: #fff;
    cursor: pointer;
    transition: opacity .25s ease, transform .12s ease, background .2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .iconbtn:hover { background: rgba(16, 20, 34, .52); }
  .iconbtn:active { transform: scale(.94); }
  .iconbtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .iconbtn svg { width: 22px; height: 22px; display: block; }
  #btn-player { left: 8px; }
  #btn-skins { left: 60px; }
  #btn-sound { right: 8px; }
  #stage[data-playing="1"] .iconbtn { opacity: .18; pointer-events: none; }
  .iconbtn .off-slash { display: none; }
  .iconbtn[aria-pressed="true"] .off-slash { display: block; }
  .iconbtn[aria-pressed="true"] .wave { display: none; }

  /* ---- overlay sheets (bird picker, players) ---- */
  .sheet {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: rgba(9, 11, 20, .82);
    backdrop-filter: blur(3px);
    padding: 16px 14px;
    gap: 12px;
    z-index: 5;
  }
  .sheet[hidden] { display: none; }
  .sheet h2 {
    font-family: "Press Start 2P", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .04em;
    color: #fff;
    margin: 2px 0 0;
    text-align: center;
    text-wrap: balance;
  }
  .sheet .hint {
    margin: 0;
    text-align: center;
    font-size: 11px;
    line-height: 1.45;
    color: rgba(255, 255, 255, .62);
  }
  .sheet .hint.warn { color: #ffcf8f; }
  .sheet-list {
    list-style: none;
    margin: 0;
    padding: 0 2px 2px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    flex: 0 1 auto;
    margin-block: auto;
    width: 100%;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid rgba(255, 255, 255, .16);
    border-radius: 3px;
    background: rgba(255, 255, 255, .07);
    color: #fff;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease;
  }
  .card:hover:not(:disabled) { background: rgba(255, 255, 255, .14); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card[aria-pressed="true"] { border-color: var(--accent); background: rgba(245, 179, 45, .18); }
  .card:disabled { cursor: not-allowed; opacity: .55; }
  .card canvas { width: 42px; height: 30px; image-rendering: pixelated; flex: none; }
  .card .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .card .name {
    font-family: "Press Start 2P", ui-monospace, monospace;
    font-size: 9px;
    letter-spacing: .03em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card .req { font-size: 11px; color: rgba(255, 255, 255, .6); }
  .card[aria-pressed="true"] .req { color: var(--accent); }

  /* players: the active row grows a rename/delete strip */
  .player-row { display: flex; flex-direction: column; gap: 0; }
  .name-input {
    font-family: "Press Start 2P", ui-monospace, monospace;
    font-size: 9px;
    letter-spacing: .03em;
    color: #fff;
    background: rgba(0, 0, 0, .35);
    border: 1px solid var(--accent);
    border-radius: 2px;
    padding: 4px 5px;
    width: 100%;
    min-width: 0;
  }
  .name-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row-tools {
    display: flex;
    gap: 6px;
    padding: 0 10px 8px;
    margin-top: -1px;
    border: 1px solid var(--accent);
    border-top: none;
    border-radius: 0 0 3px 3px;
    background: rgba(245, 179, 45, .18);
  }
  .tool {
    flex: 1;
    font-family: inherit;
    font-size: 11px;
    padding: 7px 6px;
    color: #fff;
    background: rgba(0, 0, 0, .28);
    border: 1px solid rgba(255, 255, 255, .18);
    border-radius: 3px;
    cursor: pointer;
  }
  .tool:hover { background: rgba(0, 0, 0, .45); }
  .tool:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  .tool[data-armed="1"] { background: #a3281a; border-color: #e0452f; }
  .tool:disabled { opacity: .4; cursor: not-allowed; }

  .sheet-actions { display: flex; gap: 6px; }
  .sheet-btn {
    font-family: "Press Start 2P", ui-monospace, monospace;
    font-size: 10px;
    padding: 13px;
    border: 1px solid rgba(255, 255, 255, .3);
    border-radius: 3px;
    background: rgba(255, 255, 255, .1);
    color: #fff;
    cursor: pointer;
    letter-spacing: .06em;
  }
  .sheet-actions .sheet-btn { flex: 1; font-size: 8px; padding: 11px 4px; }
  .sheet-btn:hover { background: rgba(255, 255, 255, .18); }
  .sheet-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer {
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--text-soft);
    text-align: center;
    letter-spacing: .01em;
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
  }
  footer p { margin: 0; max-width: 46ch; text-wrap: balance; }
  #install {
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--page);
    background: var(--accent);
    border: none;
    border-radius: 3px;
    padding: 9px 18px;
    cursor: pointer;
    transition: filter .18s ease, transform .12s ease;
  }
  #install:hover { filter: brightness(1.08); }
  #install:active { transform: scale(.97); }
  #install:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #install[hidden], #ios-install[hidden] { display: none; }
  :root[data-standalone="1"] footer { display: none; }
  footer b {
    font-weight: 700;
    color: var(--text);
    letter-spacing: .02em;
  }
  footer kbd {
    font-family: ui-monospace, monospace;
    font-size: 10.5px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 1px 4px;
    color: var(--text);
  }
  @media (max-height: 660px) { footer { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>

<div id="stage" data-playing="0">
  <canvas id="game" width="576" height="1024" role="img" aria-label="DreyBird — tap to flap"></canvas>

  <button id="btn-player" class="iconbtn" type="button" aria-label="Players">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="8" r="3.6"></circle>
      <path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"></path>
    </svg>
  </button>

  <button id="btn-skins" class="iconbtn" type="button" aria-label="Choose your bird">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a9 9 0 0 0 0 18h2a2 2 0 0 0 1.5-3.3 2 2 0 0 1 1.5-3.3H19a2.6 2.6 0 0 0 2-2.6A9 9 0 0 0 12 3Z"></path>
      <circle cx="8" cy="9.5" r="1.1" fill="currentColor"></circle>
      <circle cx="12.5" cy="7" r="1.1" fill="currentColor"></circle>
      <circle cx="7.5" cy="14.5" r="1.1" fill="currentColor"></circle>
    </svg>
  </button>

  <button id="btn-sound" class="iconbtn" type="button" aria-label="Mute sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6.5 9H3v6h3.5L11 19V5Z" fill="currentColor"></path>
      <g class="wave">
        <path d="M15 9.5a3.5 3.5 0 0 1 0 5"></path>
        <path d="M17.8 7a7 7 0 0 1 0 10"></path>
      </g>
      <g class="off-slash">
        <path d="M15.5 9.5 20.5 14.5"></path>
        <path d="M20.5 9.5 15.5 14.5"></path>
      </g>
    </svg>
  </button>

  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-label="Choose your bird">
    <h2>Pick a Bird</h2>
    <p class="hint">New birds unlock as your best score climbs.</p>
    <ul id="skin-list" class="sheet-list"></ul>
    <button id="sheet-close" class="sheet-btn" type="button">Back</button>
  </div>

  <div id="players" class="sheet" hidden role="dialog" aria-modal="true" aria-label="Players">
    <h2>Players</h2>
    <p class="hint" id="storage-note">Checking where your scores are saved…</p>
    <ul id="player-list" class="sheet-list"></ul>
    <div class="sheet-actions">
      <button id="player-new" class="sheet-btn" type="button">New</button>
      <button id="player-export" class="sheet-btn" type="button">Save file</button>
      <button id="player-import" class="sheet-btn" type="button">Load file</button>
    </div>
    <button id="players-close" class="sheet-btn" type="button">Back</button>
    <input id="player-file" type="file" accept="application/json,.json" hidden>
  </div>
</div>

<footer>
  <p><b>DreyBird</b> — tap, click, or press <kbd>Space</kbd> to flap. Mind the pipes.</p>
  <p id="ios-install" hidden>Keep it on your home screen: tap <b>Share</b>, then <b>Add to Home Screen</b>.</p>
  <button id="install" type="button" hidden>Install DreyBird</button>
</footer>

<script>
(() => {
  'use strict';

  /* ══════════════════════════════════════════════════════════════════
     DreyBird — a one-file tribute to Flappy Bird.
     Logical playfield is 288×512 (the original's aspect); everything is
     simulated in those units at a fixed 60 Hz so the game feels identical
     on a 60 Hz phone and a 120 Hz one.
     ══════════════════════════════════════════════════════════════════ */

  const W = 288, H = 512;      // logical size
  const GY = 400;              // ground line (top of the base strip)
  const RS = 2;                // render supersample
  const DT = 1000 / 60;        // one logical tick, in ms

  // --- feel ---------------------------------------------------------
  const GRAVITY   = 0.42;
  const FLAP_V    = -6.7;
  const MAX_VY    = 11;
  const BIRD_X    = 64;
  const SPEED     = 2.05;      // pipe scroll, px/tick
  const PIPE_W    = 52;
  const GAP       = 104;
  const SPACING   = 156;       // horizontal distance between pipe pairs
  const LIP_H     = 14;
  const GAP_MIN   = 96, GAP_MAX = 308;
  const HIT_W     = 18, HIT_H = 13;   // forgiving hitbox, like the original
  const PU_R      = 10;
  const PU_TICKS  = 380;       // ~6.3 s of power-up
  const SLOWMO    = 0.58;
  const SHIELD_IV = 46;        // invulnerable ticks after a shield pops

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── persistence ──────────────────────────────────────────────────
     Two device-level preferences stay in localStorage (mute, legacy keys).
     Everything a *player* owns lives in the vault below.
     Nothing here is security: profiles are labels on a couch game. */
  const store = {
    get(k, d) {
      try { const v = localStorage.getItem('dreybird.' + k); return v == null ? d : JSON.parse(v); }
      catch (e) { return d; }
    },
    set(k, v) { try { localStorage.setItem('dreybird.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } }
  };

  /* ── the vault: IndexedDB, falling back to localStorage ───────────
     IndexedDB because a profile is a structured record with history, not
     a string. localStorage stays as the fallback for private windows and
     anywhere IndexedDB is blocked — the game must never fail to start
     because storage is unavailable.

     Every method is async, but the game loop is not: the vault is read
     once during boot and held in memory, and writes are fire-and-forget.
     This is also the seam a future server sync would slot into. */
  const DB_NAME = 'dreybird', DB_VER = 1, LS_VAULT = 'dreybird.vault';

  const vault = {
    kind: 'none',
    db: null,

    /* Writes are started immediately but run one at a time. Without the
       queue, a profile write and the active-profile write can interleave
       and a reload can catch the store half-updated. flush() is the
       promise that everything queued so far has landed. */
    chain: Promise.resolve(),
    enqueue(work) {
      this.chain = this.chain.then(work, work);
      return this.chain;
    },
    flush() { return this.chain; },

    async open() {
      try {
        this.db = await new Promise((res, rej) => {
          if (!self.indexedDB) return rej(new Error('no indexedDB'));
          const req = indexedDB.open(DB_NAME, DB_VER);
          req.onupgradeneeded = () => {
            const d = req.result;
            if (!d.objectStoreNames.contains('profiles')) d.createObjectStore('profiles', { keyPath: 'id' });
            if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
          };
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error || new Error('open failed'));
          req.onblocked = () => rej(new Error('blocked'));
        });
        this.kind = 'indexeddb';
      } catch (e) {
        this.db = null;
        this.kind = self.localStorage ? 'localstorage' : 'memory';
      }
      return this.kind;
    },

    tx(names, mode) {
      const t = this.db.transaction(names, mode);
      return names.map(n => t.objectStore(n)).concat(t);
    },

    req(request) {
      return new Promise((res, rej) => {
        request.onsuccess = () => res(request.result);
        request.onerror = () => rej(request.error);
      });
    },

    lsRead() {
      try { return JSON.parse(localStorage.getItem(LS_VAULT)) || null; } catch (e) { return null; }
    },
    lsWrite(state) {
      try { localStorage.setItem(LS_VAULT, JSON.stringify(state)); } catch (e) { /* full or blocked */ }
    },

    async load() {
      if (this.kind === 'indexeddb') {
        try {
          const [profs, meta] = this.tx(['profiles', 'meta'], 'readonly');
          const list = await this.req(profs.getAll());
          const activeId = await this.req(meta.get('activeId'));
          return { profiles: list || [], activeId: activeId || null };
        } catch (e) { /* fall through to the fallback below */ }
      }
      const state = this.kind === 'memory' ? null : this.lsRead();
      return state || { profiles: [], activeId: null };
    },

    putProfile(profile) { return this.enqueue(() => this.writePutProfile(profile)); },

    async writePutProfile(profile) {
      if (this.kind === 'indexeddb') {
        try {
          const [profs] = this.tx(['profiles'], 'readwrite');
          await this.req(profs.put(profile));
          return;
        } catch (e) { /* fall through */ }
      }
      if (this.kind === 'memory') return;
      const state = this.lsRead() || { profiles: [], activeId: null };
      const i = state.profiles.findIndex(p => p.id === profile.id);
      if (i < 0) state.profiles.push(profile); else state.profiles[i] = profile;
      this.lsWrite(state);
    },

    delProfile(id) { return this.enqueue(() => this.writeDelProfile(id)); },

    async writeDelProfile(id) {
      if (this.kind === 'indexeddb') {
        try {
          const [profs] = this.tx(['profiles'], 'readwrite');
          await this.req(profs.delete(id));
          return;
        } catch (e) { /* fall through */ }
      }
      if (this.kind === 'memory') return;
      const state = this.lsRead() || { profiles: [], activeId: null };
      state.profiles = state.profiles.filter(p => p.id !== id);
      this.lsWrite(state);
    },

    setActive(id) { return this.enqueue(() => this.writeSetActive(id)); },

    async writeSetActive(id) {
      if (this.kind === 'indexeddb') {
        try {
          const [meta] = this.tx(['meta'], 'readwrite');
          await this.req(meta.put(id, 'activeId'));
          return;
        } catch (e) { /* fall through */ }
      }
      if (this.kind === 'memory') return;
      const state = this.lsRead() || { profiles: [], activeId: null };
      state.activeId = id;
      this.lsWrite(state);
    }
  };

  /* ── profiles ─────────────────────────────────────────────────────
     A profile is who is playing, not an account: no password, no server.
     Several people share a device; each keeps their own bird and record. */
  const MAX_NAME = 12;

  function newProfile(name) {
    return {
      id: 'p' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
      name: (name || 'Player').slice(0, MAX_NAME),
      skin: 'classic',
      best: 0,
      created: Date.now(),
      stats: { games: 0, pipes: 0, longest: 0, powers: 0, bronze: 0, silver: 0, gold: 0, platinum: 0 }
    };
  }

  // Tolerate anything: imported files and older records may be partial.
  function sane(p) {
    const d = newProfile(p && p.name);
    if (!p || typeof p !== 'object') return d;
    const st = p.stats && typeof p.stats === 'object' ? p.stats : {};
    const num = (v, f) => (typeof v === 'number' && isFinite(v) && v >= 0 ? Math.floor(v) : f);
    return {
      id: typeof p.id === 'string' && p.id ? p.id : d.id,
      name: (typeof p.name === 'string' && p.name.trim() ? p.name.trim() : d.name).slice(0, MAX_NAME),
      skin: typeof p.skin === 'string' ? p.skin : 'classic',
      best: num(p.best, 0),
      created: num(p.created, d.created),
      stats: {
        games: num(st.games, 0), pipes: num(st.pipes, 0), longest: num(st.longest, 0),
        powers: num(st.powers, 0), bronze: num(st.bronze, 0), silver: num(st.silver, 0),
        gold: num(st.gold, 0), platinum: num(st.platinum, 0)
      }
    };
  }

  let profiles = [];
  let profile = null;
  let persisted = false;
  let persistAsked = false;

  // Written immediately, not debounced: saves happen at the end of a run
  // or when a bird is picked — rare events, and exactly the moments a
  // player is most likely to close the tab. A debounce here would quietly
  // drop the run someone just finished.
  function saveProfile() {
    if (!profile) return Promise.resolve();
    return vault.putProfile(JSON.parse(JSON.stringify(profile)));
  }

  function applyProfile() {
    if (!profile) return;
    G.best = profile.best;
    G.skin = SKINS.find(s => s.id === profile.skin) || SKINS[0];
  }

  /* Durable storage is not the default: browsers evict under pressure and
     iOS drops site data after about a week of no visits. Ask, then tell
     the player the truth about the answer. */
  async function askPersist() {
    if (persistAsked) return persisted;
    persistAsked = true;
    try {
      if (navigator.storage && navigator.storage.persisted) {
        persisted = await navigator.storage.persisted();
        if (!persisted && navigator.storage.persist) persisted = await navigator.storage.persist();
      }
    } catch (e) { persisted = false; }
    updateStorageNote();
    return persisted;
  }

  /* ── skins: pure palette swaps of one pixel grid ────────────────── */
  const SKINS = [
    { id: 'classic', name: 'Classic', need: 0,
      p: { O: '#302010', B: '#f8d840', L: '#fbf0b8', W: '#e8ac1c', E: '#ffffff', P: '#2a1c10', K: '#f2762a', S: '#c9531a' } },
    { id: 'sky', name: 'Bluebird', need: 5,
      p: { O: '#132741', B: '#4fb6f0', L: '#dff1ff', W: '#2b86c9', E: '#ffffff', P: '#10202f', K: '#ffb03a', S: '#d1811d' } },
    { id: 'ember', name: 'Ember', need: 15,
      p: { O: '#3d1006', B: '#f0532c', L: '#ffd08a', W: '#c22f18', E: '#fff2d0', P: '#3d1006', K: '#ffd23f', S: '#d19a1a' } },
    { id: 'ghost', name: 'Ghost', need: 25,
      p: { O: '#8fa7c4', B: '#e9f2ff', L: '#ffffff', W: '#c3d6ee', E: '#ffffff', P: '#4a5b74', K: '#b9c9e0', S: '#93a7c2' }, alpha: 0.72 },
    { id: 'circuit', name: 'Circuit', need: 40,
      p: { O: '#04150f', B: '#1d3b30', L: '#3ef2a0', W: '#12634a', E: '#3ef2a0', P: '#04150f', K: '#8affd0', S: '#35b98d' } }
  ];

  // 17 × 12 cells, 2 px each → the original's 34 × 24 bird.
  // O outline · B body · L belly · W wing · E eye · P pupil · K beak
  const BIRD_ART = [
    '.....OOOOOO......',
    '...OOBBBBBBBOO...',
    '..OBBBBBBBEEEEO..',
    '.OBBBBBBBBEPPEO..',
    '.OBWWWWWBBEPPEO..',
    'OBWWWWWWWBEEEEOKK',
    'OBWWWWWWWBBBBOKKK',
    'OBWWWWWBBLLLLLKKS',
    '.OBWWWBBBLLLLLLS.',
    '..OBBBBLLLLLLLLO.',
    '...OOBBBLLLLLLOO.',
    '.....OOOOOOOOO...'
  ];
  const ART_W = 17, ART_H = 12, CELL = 2;

  /* ── sky phases: a slow day → sunset → night → dawn cycle ───────── */
  const PHASES = [
    { sky: ['#3fb3dd', '#a9e4f2'], cloud: '#ffffff', city: '#6fc9b6', dirt: '#ddd694', grass: '#79bd3f', star: 0.0, sun: '#fff6c8' },
    { sky: ['#e8724a', '#ffcf8f'], cloud: '#ffe3cd', city: '#a25f63', dirt: '#d5b880', grass: '#9c8639', star: 0.1, sun: '#ffe9a8' },
    { sky: ['#0c1638', '#243063'], cloud: '#39447a', city: '#161e46', dirt: '#87805a', grass: '#3d5730', star: 1.0, sun: '#dfe6ff' },
    { sky: ['#5d5aa2', '#f0a79c'], cloud: '#e3cfdd', city: '#565080', dirt: '#c6ba8d', grass: '#688c45', star: 0.28, sun: '#ffd9c0' }
  ];
  const PHASE_LEN = 1750;   // px of scroll per phase

  /* ── tiny colour helpers ────────────────────────────────────────── */
  const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => {
    const A = hex2rgb(a), B = hex2rgb(b);
    return 'rgb(' + Math.round(A[0] + (B[0] - A[0]) * t) + ',' +
                    Math.round(A[1] + (B[1] - A[1]) * t) + ',' +
                    Math.round(A[2] + (B[2] - A[2]) * t) + ')';
  };
  const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);

  /* ── audio: synthesised on the fly, unlocked by the first tap ───── */
  const audio = {
    ctx: null,
    muted: store.get('muted', false),
    ensure() {
      if (this.ctx || this.muted) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try { this.ctx = new AC(); } catch (e) { this.ctx = null; }
    },
    tone(type, f0, f1, dur, vol, delay) {
      if (this.muted) return;
      this.ensure();
      const c = this.ctx;
      if (!c) return;
      if (c.state === 'suspended') c.resume();
      const t0 = c.currentTime + (delay || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(c.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.03);
    },
    flap()   { this.tone('square', 620, 300, 0.09, 0.05); },
    score()  { this.tone('triangle', 880, 880, 0.07, 0.07); this.tone('triangle', 1320, 1320, 0.09, 0.06, 0.06); },
    hit()    { this.tone('sawtooth', 260, 60, 0.16, 0.09); },
    die()    { this.tone('sine', 520, 70, 0.42, 0.06, 0.08); },
    power()  { this.tone('triangle', 660, 660, 0.07, 0.06); this.tone('triangle', 990, 990, 0.07, 0.06, 0.06); this.tone('triangle', 1480, 1480, 0.11, 0.05, 0.12); },
    pop()    { this.tone('square', 320, 140, 0.14, 0.06); }
  };

  /* ── world state ────────────────────────────────────────────────── */
  const READY = 0, PLAYING = 1, DYING = 2, OVER = 3;

  const bird = { x: BIRD_X, y: 240, py: 240, vy: 0, rot: 0, prot: 0, wing: 0 };
  const pipes = [];
  const powers = [];
  const puffs = [];

  const G = {
    state: READY,
    score: 0,
    best: 0,
    newBest: false,
    ticks: 0,
    scroll: 0,        // ground / cycle scroll distance
    cycle: 0,
    flash: 0,
    shake: 0,
    overAt: 0,
    shield: false,
    slow: 0,          // remaining slow-mo ticks
    invuln: 0,
    lastGap: 200,
    runTicks: 0,
    skin: SKINS[0]
  };

  const unlocked = s => G.best >= s.need;

  const stars = [];
  for (let i = 0; i < 46; i++) {
    stars.push({ x: (i * 61.8) % W, y: (i * 37.3) % (GY - 90), r: i % 5 === 0 ? 1.4 : 0.9, tw: (i % 7) / 7 });
  }
  const buildings = [];
  for (let i = 0; i < 30; i++) {
    buildings.push({ x: i * 38, w: 20 + (i * 13) % 16, h: 20 + (i * 29) % 34 });
  }
  const clouds = [];
  for (let i = 0; i < 7; i++) {
    clouds.push({ x: i * 92, y: 46 + (i * 53) % 150, s: 0.8 + (i % 3) * 0.35 });
  }

  /* ══════════════════ simulation ══════════════════ */

  function resetWorld() {
    pipes.length = 0;
    powers.length = 0;
    puffs.length = 0;
    bird.y = bird.py = 236;
    bird.vy = 0;
    bird.rot = bird.prot = 0;
    G.score = 0;
    G.newBest = false;
    G.ticks = 0;
    G.flash = 0;
    G.shake = 0;
    G.shield = false;
    G.slow = 0;
    G.invuln = 0;
    G.lastGap = 200;
    G.state = READY;
    syncStage();
  }

  function spawnPipe(x) {
    // Keep consecutive gaps within reach of each other so runs stay fair.
    const drift = 92;
    const lo = Math.max(GAP_MIN, G.lastGap - drift);
    const hi = Math.min(GAP_MAX, G.lastGap + drift);
    const gap = Math.round(lo + Math.random() * (hi - lo));
    G.lastGap = gap;
    pipes.push({ x, px: x, gap, scored: false });

    // A power-up floats between this pipe and the next — never in the
    // opening stretch, and only now and then.
    if (G.score >= 4 && Math.random() < 0.24) {
      powers.push({
        x: x + PIPE_W / 2 + SPACING / 2,
        px: x + PIPE_W / 2 + SPACING / 2,
        y: clamp(gap + (Math.random() * 40 - 20), 70, GY - 70),
        kind: Math.random() < 0.5 ? 'shield' : 'slow',
        got: false,
        bob: Math.random() * Math.PI * 2
      });
    }
  }

  function startPlay() {
    G.state = PLAYING;
    G.ticks = 0;
    G.runTicks = 0;
    pipes.length = 0;
    powers.length = 0;
    spawnPipe(W + 40);
    spawnPipe(W + 40 + SPACING);
    spawnPipe(W + 40 + SPACING * 2);
    syncStage();
  }

  function flap() {
    bird.vy = FLAP_V;
    bird.wing = 9;
    audio.flap();
  }

  function die(fromPipe) {
    G.state = DYING;
    bird.vy = Math.min(bird.vy, -2.4);
    G.flash = reduceMotion ? 0 : 1;
    G.shake = reduceMotion ? 0 : 9;
    audio.hit();
    audio.die();
    if (fromPipe) puff(bird.x + 6, bird.y, '#ffffff', 8);
    syncStage();
  }

  function land() {
    G.state = OVER;
    G.overAt = G.ticks;
    if (G.score > G.best) { G.best = G.score; G.newBest = true; buildSheet(); }
    recordRun();
    syncStage();
  }

  // One finished run, folded into whoever is playing.
  function recordRun() {
    if (!profile) return;
    const st = profile.stats;
    st.games++;
    st.longest = Math.max(st.longest, G.runTicks);
    if (G.score > profile.best) profile.best = G.score;
    const m = medalFor(G.score);
    if (m) st[m.name.toLowerCase()]++;
    saveProfile();
    buildPlayers();
  }

  function puff(x, y, color, n) {
    if (reduceMotion) return;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random();
      puffs.push({ x, y, vx: Math.cos(a) * (0.8 + Math.random()), vy: Math.sin(a) * (0.8 + Math.random()), life: 24, color });
    }
  }

  function hitsPipe(p) {
    const bx = bird.x - HIT_W / 2, by = bird.y - HIT_H / 2;
    if (bx + HIT_W < p.x || bx > p.x + PIPE_W) return false;
    return by < p.gap - GAP / 2 || by + HIT_H > p.gap + GAP / 2;
  }

  function tick() {
    G.ticks++;
    const ts = G.slow > 0 && G.state === PLAYING ? SLOWMO : 1;

    bird.py = bird.y;
    bird.prot = bird.rot;
    if (bird.wing > 0) bird.wing--;

    if (G.state === READY) {
      // Idle bob on the title screen.
      bird.y = 236 + Math.sin(G.ticks / 15) * 6;
      bird.rot = Math.sin(G.ticks / 15) * 0.07;
      G.scroll += SPEED;
      G.cycle += SPEED;
    } else if (G.state === PLAYING) {
      G.runTicks++;
      bird.vy = clamp(bird.vy + GRAVITY * ts, -20, MAX_VY);
      bird.y += bird.vy * ts;
      G.scroll += SPEED * ts;
      G.cycle += SPEED * ts;

      for (const p of pipes) { p.px = p.x; p.x -= SPEED * ts; }
      for (const q of powers) { q.px = q.x; q.x -= SPEED * ts; q.bob += 0.07; }

      // Recycle: drop what has left the screen, keep three pairs ahead.
      while (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();
      while (powers.length && powers[0].x + PU_R < -10) powers.shift();
      const last = pipes[pipes.length - 1];
      if (!last || last.x < W + 40 + SPACING) spawnPipe((last ? last.x : W) + SPACING);

      // Score: the pipe's centre line passes the bird.
      for (const p of pipes) {
        if (!p.scored && p.x + PIPE_W / 2 < bird.x) {
          p.scored = true;
          G.score++;
          if (profile) profile.stats.pipes++;
          audio.score();
        }
      }

      // Power-ups.
      for (const q of powers) {
        if (q.got) continue;
        const dx = Math.abs(q.x - bird.x), dy = Math.abs(q.y - bird.y);
        if (dx < PU_R + HIT_W / 2 && dy < PU_R + HIT_H / 2) {
          q.got = true;
          if (q.kind === 'shield') G.shield = true;
          else G.slow = PU_TICKS;
          if (profile) profile.stats.powers++;
          audio.power();
          puff(q.x, q.y, q.kind === 'shield' ? '#7fdcff' : '#c9a0ff', 10);
        }
      }
      if (G.slow > 0) G.slow--;
      if (G.invuln > 0) G.invuln--;

      // Collisions.
      if (bird.y + HIT_H / 2 >= GY) { bird.y = GY - HIT_H / 2; die(false); }
      else if (bird.y - HIT_H / 2 < 0) { bird.y = HIT_H / 2; bird.vy = 0; }
      else if (G.invuln === 0) {
        for (const p of pipes) {
          if (hitsPipe(p)) {
            if (G.shield) {
              G.shield = false;
              G.invuln = SHIELD_IV;
              bird.vy = Math.min(bird.vy, -3.4);
              audio.pop();
              puff(bird.x, bird.y, '#7fdcff', 12);
              G.flash = reduceMotion ? 0 : 0.45;
            } else {
              die(true);
            }
            break;
          }
        }
      }

      // Rotation follows velocity: nose up on a flap, dive on the way down.
      const target = bird.vy < 0 ? -0.42 : clamp(bird.vy * 0.13, -0.42, 1.5);
      bird.rot += (target - bird.rot) * 0.18;
    } else if (G.state === DYING) {
      bird.vy = clamp(bird.vy + GRAVITY * 1.1, -20, MAX_VY);
      bird.y += bird.vy;
      bird.rot = Math.min(bird.rot + 0.11, 1.62);
      if (bird.y + HIT_H / 2 >= GY) { bird.y = GY - HIT_H / 2; land(); }
    }

    if (G.flash > 0) G.flash = Math.max(0, G.flash - 0.09);
    if (G.shake > 0) G.shake = Math.max(0, G.shake - 0.7);
    for (let i = puffs.length - 1; i >= 0; i--) {
      const f = puffs[i];
      f.x += f.vx; f.y += f.vy; f.vy += 0.06; f.life--;
      if (f.life <= 0) puffs.splice(i, 1);
    }
  }

  /* ══════════════════ rendering ══════════════════ */

  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  function px(c, size) { c.font = size + 'px "Press Start 2P", ui-monospace, monospace'; }

  function textOut(c, str, x, y, size, fill, outline, align) {
    px(c, size);
    c.textAlign = align || 'center';
    c.textBaseline = 'middle';
    c.lineJoin = 'round';
    c.miterLimit = 2;
    c.lineWidth = Math.max(2, size * 0.28);
    c.strokeStyle = outline || '#20160a';
    c.strokeText(str, x, y);
    c.fillStyle = fill || '#ffffff';
    c.fillText(str, x, y);
  }

  function phaseNow() {
    const seg = ((G.cycle / PHASE_LEN) % 4 + 4) % 4;
    const i = Math.floor(seg);
    const t = smooth(clamp((seg - i - 0.55) / 0.45, 0, 1));
    const a = PHASES[i], b = PHASES[(i + 1) % 4];
    return {
      sky0: mix(a.sky[0], b.sky[0], t), sky1: mix(a.sky[1], b.sky[1], t),
      cloud: mix(a.cloud, b.cloud, t), city: mix(a.city, b.city, t),
      dirt: mix(a.dirt, b.dirt, t), grass: mix(a.grass, b.grass, t),
      sun: mix(a.sun, b.sun, t), star: lerp(a.star, b.star, t)
    };
  }

  function drawBird(c, x, y, rot, skin, wing, alphaOverride) {
    const P = skin.p;
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    c.globalAlpha = alphaOverride != null ? alphaOverride : (skin.alpha || 1);
    const ox = -ART_W * CELL / 2, oy = -ART_H * CELL / 2;
    for (let r = 0; r < ART_H; r++) {
      const row = BIRD_ART[r];
      for (let col = 0; col < ART_W; col++) {
        const ch = row[col];
        if (ch === '.') continue;
        const fill = P[ch];
        if (!fill) continue;
        c.fillStyle = fill;
        c.fillRect(ox + col * CELL, oy + r * CELL + (ch === 'W' ? wing : 0), CELL, CELL);
      }
    }
    c.restore();
  }

  function drawSky(ph) {
    const g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, ph.sky0);
    g.addColorStop(1, ph.sky1);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, GY);

    if (ph.star > 0.02) {
      ctx.save();
      for (const s of stars) {
        ctx.globalAlpha = ph.star * (0.45 + 0.55 * Math.abs(Math.sin(G.ticks / 40 + s.tw * 6)));
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(s.x, s.y, s.r * 2, s.r * 2);
      }
      ctx.restore();
    }

    // Sun / moon, low and lazy on the right.
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = ph.sun;
    ctx.beginPath();
    ctx.arc(224, 84, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.16;
    ctx.beginPath();
    ctx.arc(224, 84, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Skyline, parallax at a quarter speed.
    const bo = (G.scroll * 0.25) % 38;
    for (const b of buildings) {
      const x = Math.round(b.x - bo - 38);
      if (x > W || x + b.w < 0) continue;
      ctx.fillStyle = ph.city;
      ctx.fillRect(x, GY - b.h, b.w, b.h);
      if (ph.star > 0.25) {
        ctx.save();
        ctx.globalAlpha = ph.star * 0.75;
        ctx.fillStyle = '#ffd98a';
        for (let wy = GY - b.h + 5; wy < GY - 6; wy += 8) {
          for (let wx = x + 4; wx < x + b.w - 4; wx += 7) {
            if ((wx * 7 + wy * 13) % 5 < 2) ctx.fillRect(wx, wy, 3, 3);
          }
        }
        ctx.restore();
      }
    }

    // Clouds at half speed.
    const co = (G.scroll * 0.5) % (W + 200);
    ctx.fillStyle = ph.cloud;
    ctx.globalAlpha = 0.9;
    for (const cl of clouds) {
      const x = ((cl.x - co) % (W + 200) + W + 200) % (W + 200) - 100;
      const s = cl.s;
      ctx.fillRect(x, cl.y, 26 * s, 8 * s);
      ctx.fillRect(x + 6 * s, cl.y - 6 * s, 15 * s, 8 * s);
      ctx.fillRect(x - 6 * s, cl.y + 4 * s, 34 * s, 7 * s);
    }
    ctx.globalAlpha = 1;
  }

  function drawPipe(p, x) {
    const top = p.gap - GAP / 2, bot = p.gap + GAP / 2;
    const body = '#63c53c', light = '#9de86f', dark = '#2f7a24', edge = '#1d4a18';

    const column = (y, h) => {
      ctx.fillStyle = body;   ctx.fillRect(x, y, PIPE_W, h);
      ctx.fillStyle = light;  ctx.fillRect(x + 5, y, 8, h);
      ctx.fillStyle = dark;   ctx.fillRect(x + PIPE_W - 13, y, 9, h);
      ctx.fillStyle = edge;   ctx.fillRect(x, y, 2, h); ctx.fillRect(x + PIPE_W - 2, y, 2, h);
    };
    const lip = y => {
      const lx = x - 4, lw = PIPE_W + 8;
      ctx.fillStyle = body;   ctx.fillRect(lx, y, lw, LIP_H);
      ctx.fillStyle = light;  ctx.fillRect(lx + 5, y, 8, LIP_H);
      ctx.fillStyle = dark;   ctx.fillRect(lx + lw - 13, y, 9, LIP_H);
      ctx.fillStyle = edge;
      ctx.fillRect(lx, y, 2, LIP_H); ctx.fillRect(lx + lw - 2, y, 2, LIP_H);
      ctx.fillRect(lx, y, lw, 2);    ctx.fillRect(lx, y + LIP_H - 2, lw, 2);
    };

    column(0, top - LIP_H);
    lip(top - LIP_H);
    column(bot + LIP_H, GY - bot - LIP_H);
    lip(bot);
  }

  function drawPower(q, x) {
    const y = q.y + Math.sin(q.bob) * 3;
    const shield = q.kind === 'shield';
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = shield ? '#7fdcff' : '#c9a0ff';
    ctx.beginPath(); ctx.arc(x, y, PU_R + 4, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = shield ? '#2f9fd8' : '#8a5ad0';
    ctx.beginPath(); ctx.arc(x, y, PU_R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = shield ? '#d6f4ff' : '#f0e2ff';
    if (shield) {
      ctx.fillRect(x - 5, y - 6, 10, 6);
      ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 7); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(x - 6, y - 7, 12, 2);
      ctx.fillRect(x - 6, y + 5, 12, 2);
      ctx.beginPath(); ctx.moveTo(x - 5, y - 5); ctx.lineTo(x + 5, y - 5); ctx.lineTo(x, y); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 5, y + 5); ctx.lineTo(x + 5, y + 5); ctx.lineTo(x, y); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawGround(ph) {
    ctx.fillStyle = ph.dirt;
    ctx.fillRect(0, GY + 10, W, H - GY - 10);
    ctx.fillStyle = ph.grass;
    ctx.fillRect(0, GY, W, 10);
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.fillRect(0, GY + 10, W, 2);

    const o = G.scroll % 24;
    ctx.fillStyle = 'rgba(0,0,0,.10)';
    for (let x = -24; x < W + 24; x += 24) ctx.fillRect(Math.round(x - o), GY + 16, 12, 4);
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    for (let x = -24; x < W + 24; x += 24) ctx.fillRect(Math.round(x - o + 12), GY + 26, 8, 3);
  }

  function drawHud() {
    if (G.state === PLAYING || G.state === DYING) {
      textOut(ctx, String(G.score), W / 2, 62, 24, '#ffffff', '#20160a');
    }
    if (G.slow > 0 && G.state === PLAYING) {
      const w = 74, x = (W - w) / 2, y = 88;
      ctx.fillStyle = 'rgba(20,16,34,.45)'; ctx.fillRect(x - 1, y - 1, w + 2, 7);
      ctx.fillStyle = '#c9a0ff';            ctx.fillRect(x, y, w * (G.slow / PU_TICKS), 5);
      textOut(ctx, 'SLOW-MO', W / 2, y + 15, 6, '#e5d4ff', '#231a3a');
    }
    if (G.shield && G.state === PLAYING) {
      textOut(ctx, 'SHIELD', W / 2, G.slow > 0 ? 118 : 92, 6, '#cdf0ff', '#123244');
    }
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = '#20160a'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
    ctx.fillStyle = '#e7dcb4'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#fdf6de'; ctx.fillRect(x, y, w, 3);
    ctx.fillStyle = '#c3b483'; ctx.fillRect(x, y + h - 3, w, 3);
  }

  function medalFor(s) {
    if (s >= 40) return { ring: '#dbe4ee', core: '#f4f8ff', name: 'PLATINUM' };
    if (s >= 30) return { ring: '#e5b93c', core: '#ffe796', name: 'GOLD' };
    if (s >= 20) return { ring: '#b9c2cc', core: '#e6ecf3', name: 'SILVER' };
    if (s >= 10) return { ring: '#c07a35', core: '#eaa96a', name: 'BRONZE' };
    return null;
  }

  function drawMedal(m, x, y) {
    ctx.fillStyle = '#20160a'; ctx.beginPath(); ctx.arc(x, y, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = m.ring;    ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = m.core;    ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(x - 4, y - 5, 3, 0, Math.PI * 2); ctx.fill();
  }

  function drawReady() {
    textOut(ctx, 'DreyBird', W / 2, 128, 22, '#ffe07a', '#20160a');
    textOut(ctx, 'A FLAPPY TRIBUTE', W / 2, 158, 7, '#ffffff', '#20160a');
    if (Math.floor(G.ticks / 26) % 2 === 0) {
      textOut(ctx, 'TAP TO FLAP', W / 2, 316, 11, '#ffffff', '#20160a');
    }
    textOut(ctx, 'BEST  ' + G.best, W / 2, 356, 8, '#ffe07a', '#20160a');
    if (profile) textOut(ctx, profile.name.toUpperCase(), W / 2, 176, 7, '#d8f2ff', '#20160a');
  }

  function drawOver() {
    const t = clamp((G.ticks - G.overAt) / 14, 0, 1);
    const dy = (1 - smooth(t)) * 22;
    ctx.save();
    ctx.globalAlpha = smooth(t);
    ctx.translate(0, dy);

    textOut(ctx, 'GAME OVER', W / 2, 132, 18, '#ffd166', '#20160a');

    const pw = 202, ph = 100, pxx = (W - pw) / 2, pyy = 172;
    panel(pxx, pyy, pw, ph);
    ctx.fillStyle = 'rgba(32,22,10,.10)';
    ctx.fillRect(pxx + 82, pyy + 12, 2, ph - 24);

    const m = medalFor(G.score);
    if (m) {
      drawMedal(m, pxx + 42, pyy + 40);
      textOut(ctx, m.name, pxx + 42, pyy + 70, 6, '#4a3a18', '#e7dcb4');
    } else {
      textOut(ctx, 'NO MEDAL', pxx + 42, pyy + 40, 6, '#a3946a', '#e7dcb4');
      textOut(ctx, 'THIS RUN', pxx + 42, pyy + 54, 6, '#a3946a', '#e7dcb4');
    }

    const rx = pxx + pw - 16;
    textOut(ctx, 'SCORE', rx, pyy + 18, 7, '#8d7c4c', '#e7dcb4', 'right');
    textOut(ctx, String(G.score), rx, pyy + 36, 15, '#ffffff', '#20160a', 'right');
    textOut(ctx, 'BEST', rx, pyy + 62, 7, '#8d7c4c', '#e7dcb4', 'right');
    textOut(ctx, String(G.best), rx, pyy + 80, 15, '#ffffff', '#20160a', 'right');

    if (G.newBest) {
      ctx.fillStyle = '#20160a'; ctx.fillRect(pxx + 92, pyy + 54, 48, 14);
      ctx.fillStyle = '#e0452f'; ctx.fillRect(pxx + 94, pyy + 56, 44, 10);
      textOut(ctx, 'NEW!', pxx + 116, pyy + 61, 6, '#ffffff', '#a3281a');
    }

    if (G.ticks - G.overAt > 26 && Math.floor(G.ticks / 26) % 2 === 0) {
      textOut(ctx, 'TAP TO PLAY AGAIN', W / 2, 322, 9, '#ffffff', '#20160a');
    }
    ctx.restore();
  }

  function render(alpha) {
    const by = lerp(bird.py, bird.y, alpha);
    const brot = lerp(bird.prot, bird.rot, alpha);
    const ph = phaseNow();

    ctx.setTransform(RS, 0, 0, RS, 0, 0);
    if (G.shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
    }

    drawSky(ph);

    for (const p of pipes) drawPipe(p, Math.round(lerp(p.px, p.x, alpha)));
    for (const q of powers) if (!q.got) drawPower(q, lerp(q.px, q.x, alpha));

    for (const f of puffs) {
      ctx.globalAlpha = clamp(f.life / 24, 0, 1);
      ctx.fillStyle = f.color;
      ctx.fillRect(Math.round(f.x), Math.round(f.y), 3, 3);
    }
    ctx.globalAlpha = 1;

    drawGround(ph);

    const wing = bird.wing > 6 ? -2 : bird.wing > 3 ? 0 : bird.wing > 0 ? 2
      : (G.state === PLAYING || G.state === READY ? (Math.sin(G.ticks / 7) > 0 ? 0 : 2) : 0);
    const blink = G.invuln > 0 && Math.floor(G.ticks / 4) % 2 === 0 ? 0.4 : null;
    drawAuraAt(bird.x, by);
    drawBird(ctx, bird.x, by, brot, G.skin, wing, blink);

    drawHud();
    if (G.state === READY) drawReady();
    if (G.state === OVER) drawOver();

    if (G.flash > 0.01) {
      ctx.fillStyle = 'rgba(255,255,255,' + (G.flash * 0.7) + ')';
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function drawAuraAt(bx, by) {
    if (G.state !== PLAYING && G.state !== DYING) return;
    if (!G.shield && G.slow <= 0) return;
    ctx.save();
    ctx.globalAlpha = 0.3 + 0.16 * Math.sin(G.ticks / 5);
    ctx.strokeStyle = G.shield ? '#7fdcff' : '#c9a0ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(bx, by, 24, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  /* ══════════════════ loop ══════════════════ */

  let acc = 0, last = 0, started = false;

  function frame(now) {
    if (!started) { last = now; started = true; }
    let delta = now - last;
    last = now;
    if (delta > 250) delta = 250;        // tab was hidden — don't fast-forward
    acc += delta;
    let guard = 0;
    while (acc >= DT && guard++ < 8) { tick(); acc -= DT; }
    render(clamp(acc / DT, 0, 1));
  }

  function loop(now) { frame(now); requestAnimationFrame(loop); }

  /* ══════════════════ input ══════════════════ */

  const stage = document.getElementById('stage');
  const sheet = document.getElementById('sheet');
  const playersSheet = document.getElementById('players');
  const skinList = document.getElementById('skin-list');
  const btnSkins = document.getElementById('btn-skins');
  const btnSound = document.getElementById('btn-sound');

  function syncStage() {
    stage.dataset.playing = (G.state === PLAYING || G.state === DYING) ? '1' : '0';
  }

  function press() {
    if (!sheet.hidden || !playersSheet.hidden) return;
    audio.ensure();
    askPersist();
    if (G.state === READY) { startPlay(); flap(); }
    else if (G.state === PLAYING) flap();
    else if (G.state === OVER && G.ticks - G.overAt > 24) resetWorld();
  }

  cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && e.code === 'Enter') return;
      e.preventDefault();
      press();
    }
    if (e.code === 'Escape') {
      if (!sheet.hidden) closeSheet();
      else if (!playersSheet.hidden) closePlayers();
    }
  });
  addEventListener('blur', () => { if (G.state === PLAYING) { /* keep running; dt is clamped */ } });
  addEventListener('pagehide', () => { saveProfile(); });
  addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveProfile(); });

  /* ══════════════════ bird picker ══════════════════ */

  function skinPreview(skin) {
    const c = document.createElement('canvas');
    c.width = ART_W * CELL * 2;
    c.height = ART_H * CELL * 2 + 12;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.setTransform(2, 0, 0, 2, 0, 0);
    drawBird(g, ART_W * CELL / 2, ART_H * CELL / 2 + 3, 0, skin, 0, unlocked(skin) ? (skin.alpha || 1) : 0.35);
    return c;
  }

  function buildSheet() {
    skinList.textContent = '';
    for (const s of SKINS) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'skin';
      b.setAttribute('aria-pressed', String(G.skin.id === s.id));
      b.disabled = !unlocked(s);
      b.appendChild(skinPreview(s));

      const meta = document.createElement('span');
      meta.className = 'meta';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = s.name;
      const req = document.createElement('span');
      req.className = 'req';
      req.textContent = unlocked(s)
        ? (G.skin.id === s.id ? 'Equipped' : 'Tap to equip')
        : 'Reach a best of ' + s.need;
      meta.append(name, req);
      b.appendChild(meta);

      b.addEventListener('click', () => {
        if (!unlocked(s)) return;
        G.skin = s;
        if (profile) { profile.skin = s.id; saveProfile(); buildPlayers(); }
        buildSheet();
      });
      li.appendChild(b);
      skinList.appendChild(li);
    }
  }

  function openSheet() { buildSheet(); sheet.hidden = false; document.getElementById('sheet-close').focus(); }
  function closeSheet() { sheet.hidden = true; btnSkins.focus(); }

  btnSkins.addEventListener('click', openSheet);
  document.getElementById('sheet-close').addEventListener('click', closeSheet);

  btnSound.addEventListener('click', () => {
    audio.muted = !audio.muted;
    store.set('muted', audio.muted);
    btnSound.setAttribute('aria-pressed', String(audio.muted));
    btnSound.setAttribute('aria-label', audio.muted ? 'Unmute sound' : 'Mute sound');
    if (!audio.muted) { audio.ensure(); audio.score(); }
  });
  btnSound.setAttribute('aria-pressed', String(audio.muted));
  btnSound.setAttribute('aria-label', audio.muted ? 'Unmute sound' : 'Mute sound');

  /* ══════════════════ players ══════════════════ */

  const btnPlayer = document.getElementById('btn-player');
  const playerList = document.getElementById('player-list');
  const storageNote = document.getElementById('storage-note');
  const fileInput = document.getElementById('player-file');
  let editingId = null;       // profile whose name is being typed
  let armedDelete = null;     // profile whose delete button is armed

  function updateStorageNote() {
    if (!storageNote) return;
    if (vault.kind === 'memory') {
      storageNote.textContent = 'This browser is blocking storage, so scores last only until you close the tab.';
      storageNote.className = 'hint warn';
    } else if (persisted) {
      storageNote.textContent = 'Saved on this device. The browser has agreed not to clear it.';
      storageNote.className = 'hint';
    } else {
      storageNote.textContent = 'Saved on this device, but the browser may still clear it. Add DreyBird to your home screen, or keep a copy with Save file.';
      storageNote.className = 'hint warn';
    }
  }

  function playerPreview(p) {
    const skin = SKINS.find(s => s.id === p.skin) || SKINS[0];
    const c = document.createElement('canvas');
    c.width = ART_W * CELL * 2;
    c.height = ART_H * CELL * 2 + 12;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.setTransform(2, 0, 0, 2, 0, 0);
    drawBird(g, ART_W * CELL / 2, ART_H * CELL / 2 + 3, 0, skin, 0, skin.alpha || 1);
    return c;
  }

  function summarise(p) {
    const st = p.stats;
    const medals = st.platinum + st.gold + st.silver + st.bronze;
    const bits = ['Best ' + p.best, st.games + (st.games === 1 ? ' game' : ' games')];
    if (medals) bits.push(medals + (medals === 1 ? ' medal' : ' medals'));
    return bits.join('  ·  ');
  }

  function buildPlayers() {
    if (!playerList) return;
    playerList.textContent = '';

    for (const p of profiles) {
      const active = profile && p.id === profile.id;
      const li = document.createElement('li');
      li.className = 'player-row';

      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'card';
      b.setAttribute('aria-pressed', String(active));
      b.appendChild(playerPreview(p));

      const meta = document.createElement('span');
      meta.className = 'meta';

      if (editingId === p.id) {
        const input = document.createElement('input');
        input.className = 'name-input';
        input.type = 'text';
        input.maxLength = MAX_NAME;
        input.value = p.name;
        input.setAttribute('aria-label', 'Player name');
        const commit = () => {
          const v = input.value.trim().slice(0, MAX_NAME);
          if (v) { p.name = v; vault.putProfile(JSON.parse(JSON.stringify(p))); }
          editingId = null;
          buildPlayers();
        };
        input.addEventListener('keydown', e => {
          e.stopPropagation();
          if (e.key === 'Enter') commit();
          if (e.key === 'Escape') { editingId = null; buildPlayers(); }
        });
        input.addEventListener('blur', commit);
        input.addEventListener('click', e => e.stopPropagation());
        meta.appendChild(input);
        setTimeout(() => { input.focus(); input.select(); }, 0);
      } else {
        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = p.name;
        meta.appendChild(name);
      }

      const req = document.createElement('span');
      req.className = 'req';
      req.textContent = summarise(p);
      meta.appendChild(req);
      b.appendChild(meta);

      b.addEventListener('click', () => {
        if (editingId === p.id) return;
        switchProfile(p.id);
      });
      li.appendChild(b);

      // Rename and delete belong to the row you are already on, so there
      // is no second dialog to get lost in.
      if (active && editingId !== p.id) {
        const tools = document.createElement('div');
        tools.className = 'row-tools';

        const rename = document.createElement('button');
        rename.type = 'button';
        rename.className = 'tool';
        rename.textContent = 'Rename';
        rename.addEventListener('click', () => { armedDelete = null; editingId = p.id; buildPlayers(); });

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'tool';
        del.textContent = armedDelete === p.id ? 'Delete for good?' : 'Delete';
        if (armedDelete === p.id) del.dataset.armed = '1';
        del.disabled = profiles.length < 2;      // someone has to be playing
        del.addEventListener('click', () => {
          if (armedDelete !== p.id) { armedDelete = p.id; buildPlayers(); return; }
          armedDelete = null;
          deleteProfile(p.id);
        });

        tools.append(rename, del);
        li.appendChild(tools);
      }

      playerList.appendChild(li);
    }
  }

  function switchProfile(id) {
    const p = profiles.find(x => x.id === id);
    if (!p || (profile && p.id === profile.id)) return;
    profile = p;
    editingId = armedDelete = null;
    vault.setActive(p.id);
    applyProfile();
    resetWorld();
    buildSheet();
    buildPlayers();
  }

  function createProfile(name) {
    const p = newProfile(name || 'Player ' + (profiles.length + 1));
    profiles.push(p);
    vault.putProfile(p);
    profile = p;
    vault.setActive(p.id);
    applyProfile();
    resetWorld();
    editingId = p.id;
    buildSheet();
    buildPlayers();
    return p;
  }

  function deleteProfile(id) {
    if (profiles.length < 2) return;
    const wasActive = profile && profile.id === id;
    profiles = profiles.filter(p => p.id !== id);
    vault.delProfile(id);
    if (wasActive) {
      profile = profiles[0];
      vault.setActive(profile.id);
      applyProfile();
      resetWorld();
      buildSheet();
    }
    buildPlayers();
  }

  /* Export/import is the only thing that survives a cleared browser or a
     lost phone, which is what makes staying local defensible. */
  function exportSave() {
    return { app: 'dreybird', version: 1, exported: Date.now(), profiles: profiles.map(sane) };
  }

  function importSave(data) {
    if (!data || data.app !== 'dreybird' || !Array.isArray(data.profiles)) {
      return { ok: false, added: 0, merged: 0, reason: 'That file is not a DreyBird save.' };
    }
    let added = 0, merged = 0;
    for (const raw of data.profiles) {
      const incoming = sane(raw);
      const mine = profiles.find(p => p.id === incoming.id);
      if (!mine) {
        profiles.push(incoming);
        vault.putProfile(incoming);
        added++;
      } else {
        // Never silently lose a record: keep the better of each number.
        mine.best = Math.max(mine.best, incoming.best);
        for (const k of Object.keys(mine.stats)) {
          mine.stats[k] = Math.max(mine.stats[k], incoming.stats[k] || 0);
        }
        if (mine.name !== incoming.name && incoming.name) mine.name = incoming.name;
        vault.putProfile(JSON.parse(JSON.stringify(mine)));
        merged++;
      }
    }
    applyProfile();
    buildSheet();
    buildPlayers();
    return { ok: true, added: added, merged: merged };
  }

  function openPlayers() {
    editingId = armedDelete = null;
    buildPlayers();
    updateStorageNote();
    askPersist();
    playersSheet.hidden = false;
    document.getElementById('players-close').focus();
  }
  function closePlayers() {
    editingId = armedDelete = null;
    playersSheet.hidden = true;
    btnPlayer.focus();
  }

  btnPlayer.addEventListener('click', openPlayers);
  document.getElementById('players-close').addEventListener('click', closePlayers);
  document.getElementById('player-new').addEventListener('click', () => createProfile());

  // Embedded viewers (the published artifact among them) refuse
  // page-initiated downloads, so a download link there is a dead button.
  // Fall back to the clipboard, which works everywhere.
  const canDownload = window.top === window.self;
  const exportBtn = document.getElementById('player-export');
  if (!canDownload) exportBtn.textContent = 'Copy save';

  exportBtn.addEventListener('click', async () => {
    const text = JSON.stringify(exportSave(), null, 2);
    if (!canDownload) {
      try {
        await navigator.clipboard.writeText(text);
        storageNote.textContent = 'Save copied to the clipboard. Paste it somewhere safe.';
        storageNote.className = 'hint';
      } catch (e) {
        storageNote.textContent = 'This viewer blocks both downloads and the clipboard. Open the game in its own tab to save a copy.';
        storageNote.className = 'hint warn';
      }
      return;
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dreybird-save.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  document.getElementById('player-import').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let result;
      try { result = importSave(JSON.parse(String(reader.result))); }
      catch (e) { result = { ok: false, reason: 'That file could not be read.' }; }
      if (!result.ok) {
        storageNote.textContent = result.reason;
        storageNote.className = 'hint warn';
      } else {
        storageNote.textContent = 'Loaded ' + result.added + ' new, updated ' + result.merged + '.';
        storageNote.className = 'hint';
      }
    };
    reader.readAsText(file);
    fileInput.value = '';
  });

  /* ══════════════════ boot ══════════════════ */

  // Storage is async; the game loop is not. Read everything once, here,
  // and hand the loop a plain object it can touch synchronously.
  async function boot() {
    await vault.open();
    const state = await vault.load();
    profiles = (state.profiles || []).map(sane);
    profiles.sort((a, b) => a.created - b.created);

    if (!profiles.length) {
      // First run of this version: carry over whatever the old
      // single-player build saved, so nobody loses a high score.
      const legacyBest = store.get('best', null);
      const legacySkin = store.get('skin', null);
      const first = newProfile('Player 1');
      if (typeof legacyBest === 'number' && legacyBest > 0) first.best = legacyBest;
      if (typeof legacySkin === 'string') first.skin = legacySkin;
      profiles.push(first);
      await vault.putProfile(first);
      await vault.setActive(first.id);
    }

    profile = profiles.find(p => p.id === state.activeId) || profiles[0];
    if (profile.id !== state.activeId) vault.setActive(profile.id);

    applyProfile();
    try {
      if (navigator.storage && navigator.storage.persisted) persisted = await navigator.storage.persisted();
    } catch (e) { persisted = false; }

    buildSheet();
    buildPlayers();
    updateStorageNote();
    resetWorld();

    const go = () => requestAnimationFrame(loop);
    if (document.fonts && document.fonts.load) {
      document.fonts.load('12px "Press Start 2P"').then(go, go);
    } else {
      go();
    }

    // Hook for the headless test harness — lets a test drive the exact same
    // loop with synthetic timestamps instead of real frames. Published only
    // once boot has finished, so a test that sees it sees loaded profiles.
    window.__dreybird = {
      W, H, GY, SPEED, SPACING, PIPE_W, GAP, PU_TICKS,
      G, bird, pipes, powers,
      frame, tick, flap, press, resetWorld, startPlay, drawBird, SKINS,
      states: { READY, PLAYING, DYING, OVER },
      detach() { started = false; acc = 0; },
      // profiles
      vault,
      profiles: () => profiles,
      active: () => profile,
      createProfile, switchProfile, deleteProfile, exportSave, importSave,
      openPlayers, closePlayers,
      storage: () => ({ backend: vault.kind, persisted: persisted }),
      flush: () => vault.flush()
    };
  }

  boot();
})();
</script>

<script>
/* Packaging: manifest, service worker and the install prompt.
   Kept apart from the game, and inert wherever the packaged files don't
   exist — a file:// double-click or the published artifact — so the same
   index.html works in all three places. */
(() => {
  'use strict';

  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) document.documentElement.dataset.standalone = '1';

  const httpish = location.protocol === 'http:' || location.protocol === 'https:';
  if (!httpish || window.top !== window.self) return;

  const installBtn = document.getElementById('install');
  const iosHint = document.getElementById('ios-install');

  // Probe rather than link: a static <link rel="manifest"> that 404s would
  // log an error everywhere the file isn't served. A failed fetch is quiet.
  fetch('manifest.webmanifest', { method: 'HEAD' }).then(res => {
    if (!res.ok) return;
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'manifest.webmanifest';
    document.head.appendChild(link);

    // iOS never fires beforeinstallprompt, so it gets the manual recipe.
    const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (iOS && !standalone && iosHint) iosHint.hidden = false;
  }).catch(() => {});

  if ('serviceWorker' in navigator) {
    addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  let deferred = null;
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferred = e;
    if (installBtn) installBtn.hidden = false;
  });

  if (installBtn) {
    installBtn.addEventListener('click', () => {
      if (!deferred) return;
      installBtn.hidden = true;
      deferred.prompt();
      Promise.resolve(deferred.userChoice).catch(() => {}).then(() => { deferred = null; });
    });
  }

  addEventListener('appinstalled', () => {
    if (installBtn) installBtn.hidden = true;
    if (iosHint) iosHint.hidden = true;
  });
})();
</script>
